build:
  stage: build
  image: docker:latest
  #services:
  #  - name: docker:dind
  #    alias: dind
  variables:
    #DOCKER_DRIVER: "overlay2"
    DOCKER_HOST: unix:///var/run/docker.sock
    IMAGE_NAME: "rdrit/glpi-agent"
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache docker-cli
    - apk add --no-cache git ca-certificates
    - docker info
    - docker login -u $CI_HUB_DOCKER_LOGIN -p $CI_HUB_DOCKER_PASSWORD
    - rm -rf * .git || true
    - git clone https://git.rdr-it.com/dockerfile/glpi-agent.git .
  script:
    # On définit TAG_VERSION en priorité sur le tag Git, sinon sur "latest"
    - if [ -n "$CI_COMMIT_TAG" ]; then TAG_VERSION=$CI_COMMIT_TAG; else TAG_VERSION="latest"; fi
    - echo "Le tag utilise sera ${TAG_VERSION}"
    # No cache
    #- docker build -t $IMAGE_NAME:$TAG_VERSION -f Dockerfile --no-cache .
    # With cache
    - ls -la
    - docker build -t $IMAGE_NAME:$TAG_VERSION -f Dockerfile .
    - docker push $IMAGE_NAME:$TAG_VERSION
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Dockerfile
        - docker-entrypoint.sh